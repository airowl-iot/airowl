[platformio]
default_envs = airowl

[env:airowl]
platform = https://github.com/atomoinnovations/platform-espressif32.git
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0
board_build.flash_mode = dio
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
build_flags = 
	-DLV_CONF_INCLUDE_SIMPLE=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-DLV_USE_LOG=0
	-DLV_USE_DEBUG=0
	-DCORE_DEBUG_LEVEL=3
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=12288
	-DMBEDTLS_SSL_IN_CONTENT_LEN=4096
	-DMBEDTLS_SSL_OUT_CONTENT_LEN=2048
	-DCONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC
	-DCONFIG_MBEDTLS_DYNAMIC_BUFFER
	-Iinclude
	-Isrc
	-I src/ui/ui_airowl
	-std=gnu++17
build_unflags = 
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
lib_deps = 
 	https://github.com/moononournation/Arduino_GFX.git   
	lvgl/lvgl@^8.3.0
	adafruit/Adafruit BusIO@^1.14.1
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@7.3.1
	tzapu/WiFiManager@^2.0.17
	tobozo/WiFiManagerTz@^1.3.3
	adafruit/Adafruit CST8XX Library@^1.1.1
	fu-hsi/PMS Library@^1.1.0
	adafruit/Adafruit AHTX0@^2.0.5
	adafruit/ENS160 - Adafruit Fork@^3.0.1
	ertgtct/mcpesp@^0.1.0
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	https://github.com/me-no-dev/AsyncTCP.git
lib_extra_dirs = lib
lib_ldf_mode = deep
monitor_filters = esp32_exception_decoder, colorize, log2file
build_src_filter = 
 	+<*>              
	+<src/main.cpp>
	+<ui/ui_airowl/> 
lib_ignore =
    MatterColorLight
    MatterEnhancedColorLight
    MatterDimmableLight
    MatterFan
    MatterContactSensor
    MatterThermostat
    MatterGenericSwitch
    MatterColorTemperatureLight
