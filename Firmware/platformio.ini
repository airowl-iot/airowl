; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-st7789-cst826]
platform =  https://github.com/atomoinnovations/platform-espressif32.git
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE=1   
    -DCONFIG_ESP_MATTER_ENABLE_DATA_MODEL
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DLV_USE_LOG=0
    -DLV_USE_DEBUG=0
    -DCORE_DEBUG_LEVEL=0
    -Iinclude
    -Isrc

board_build.partitions = partitions.csv

lib_deps =
    https://github.com/moononournation/Arduino_GFX.git   
    lvgl/lvgl@^8.3.0
    https://github.com/adafruit/Adafruit_CST8XX_Library 
    adafruit/Adafruit BusIO@^1.14.1   
    tzapu/WiFiManager@^2.0.17
    tobozo/WiFiManagerTz@^1.3.3
    knolleary/PubSubClient@^2.8
    sensirion/Sensirion I2C SEN5X@^0.3.0

lib_extra_dirs = lib
lib_ldf_mode = deep
monitor_filters = esp32_exception_decoder, colorize
